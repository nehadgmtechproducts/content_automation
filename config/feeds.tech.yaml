# Tech & AI vertical source list.
# tier 1 = original reporting  |  tier 2 = aggregator/secondary  |  tier 3 = social/community
# A cluster needs >= 1 tier-1 source before it can fire (see detect/velocity.py).

defaults:
  timeout_seconds: 20
  # Sources are polled concurrently, but requests to the SAME host are serialized and
  # spaced by this much. Four subreddits hitting reddit.com at once is a guaranteed 429.
  per_host_delay_seconds: 2.0
  host_delay_overrides:
    # Unauthenticated Reddit RSS rate-limits hard, and four subreddits share this host.
    # ~24s added to a poll that runs every 10 minutes is a fine trade.
    reddit.com: 7.0
  user_agent: "content-engine/0.1 (+https://example.com/bot)"

sources:
  # ---------------- tier 1: original reporting ----------------
  - id: techcrunch
    type: rss
    tier: 1
    url: https://techcrunch.com/feed/
  - id: theverge
    type: rss
    tier: 1
    url: https://www.theverge.com/rss/index.xml
  - id: arstechnica
    type: rss
    tier: 1
    url: https://feeds.arstechnica.com/arstechnica/index
  - id: venturebeat_ai
    type: rss
    tier: 1
    url: https://venturebeat.com/category/ai/feed/
  - id: wired_business
    type: rss
    tier: 1
    url: https://www.wired.com/feed/category/business/latest/rss
  # ---------------- tier 2: Google News topical queries ----------------
  # Google News republishes originals; ingest/normalize.py resolves each item back to
  # its true publisher domain so a cluster is not credited three times to news.google.com.
  - id: gnews_ai
    type: google_news
    tier: 2
    query: "artificial intelligence OR LLM OR \"AI model\""
  - id: gnews_ai_funding
    type: google_news
    tier: 2
    query: "AI startup funding OR acquisition"
  - id: gnews_chips
    type: google_news
    tier: 2
    query: "Nvidia OR AMD OR TSMC OR \"AI chip\""
  - id: gnews_bigtech
    type: google_news
    tier: 2
    query: "OpenAI OR Anthropic OR \"Google DeepMind\" OR Meta AI OR Microsoft AI"
  - id: gnews_policy
    type: google_news
    tier: 2
    query: "AI regulation OR \"AI policy\" OR \"AI lawsuit\""

  # ---------------- tier 3: community signal ----------------
  # Reddit is polled over RSS (the .json API 403s non-browser clients). RSS carries no
  # score, so `limit` caps volume instead of `min_score`, and items are attributed to
  # reddit.com rather than to a publisher — see _fetch_reddit for why.
  - id: hn
    type: hackernews
    tier: 3
    min_points: 100
  - id: r_technology
    type: reddit
    tier: 3
    subreddit: technology
    limit: 25
  - id: r_machinelearning
    type: reddit
    tier: 3
    subreddit: MachineLearning
    limit: 25
  - id: r_localllama
    type: reddit
    tier: 3
    subreddit: LocalLLaMA
    limit: 25
  - id: r_singularity
    type: reddit
    tier: 3
    subreddit: singularity
    limit: 25
